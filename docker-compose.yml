# Dev:  docker compose up            -> http://localhost:5173 (hot reload)
# Prod: docker compose --profile prod up --build web-prod  -> http://localhost:8080
services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    env_file: .env
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules

  web-prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "8080:80"
